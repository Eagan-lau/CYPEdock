[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cypedock"
version = "0.1.0"
description = "Local-site-guided cytochrome P450 ensemble docking"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "CYPEdock contributors"}]
keywords = ["cytochrome-p450", "protein-ensemble", "pocket", "foldseek", "autodock-vina"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "biopython>=1.79",
  "numpy>=1.21",
  "PyYAML>=6",
  "rdkit>=2022.9",
]

[project.optional-dependencies]
test = ["pytest>=7,<9"]

[project.scripts]
cypedock = "cypedock.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
cypedock = [
  "resources/vina/VINA_PROVENANCE.json",
  "resources/vina/linux-x86_64/vina",
  "resources/licenses/AutoDock-Vina-LICENSE.txt",
  "resources/licenses/Boost-Software-License.txt",
  "resources/licenses/THIRD_PARTY_NOTICES.md",
  "resources/cyp450_library/README.md",
  "resources/cyp450_library/manifest.jsonl",
  "resources/cyp450_library/foldseek/.placeholder",
  "resources/cyp450_library/templates/.placeholder",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
