# Classifier/training environment.  PocketMiner feature extraction deliberately
# uses a separate legacy TensorFlow environment; see requirements-features.txt.
name: cypocket-classifier
channels:
  - conda-forge
dependencies:
  - python=3.9.9
  - pip=23.2.1
  - setuptools=68.0.0
  - wheel=0.41.2
  - pip:
      - -r requirements-classifier.txt
      - -e .
